[project]
name = "langchain-langgraph-gemini-demo"
version = "0.1.0"
description = "Simple demo for LangChain + LangGraph with switchable LLM providers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ipython>=8.0.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-google-genai>=2.1.0",
  "langchain-openai>=0.3.0",
  "langgraph>=0.2.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
